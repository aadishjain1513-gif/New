<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Variables</h1>
    <h2>Calculator</h2>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>
    <p id="stu"></p>
    <script>
        var num1 = 10;
        var num2 = 6;
        var sum = num1 + num2;
        var diff = num1 - num2;
        var multiple = num1 * num2;
        var division = num1 / num2;
        document.getElemenentById("add").innerHTML ="The total sum is: " + sum;
        document.getElemenentById("sub").innerHTML = "The difference is: " + diff;
        document.getElemenentById("mul").innerHTML = "The multiple is: " + multiple;
        document.getElemenentById("div").innerHTML = "The division is: " + division;
        document.getElemenentById("stu").innerHTML = "The namrs of the students in this class are: Saransh, Aadish";
    </script>
</body>
</html>
